name: Lighthouse

# Runs Lighthouse CI (performance, accessibility, best-practices, SEO)
# against index.html, privacy.html, and design-system.html on every push
# that could affect them. Currently informational only (see
# lighthouserc.js): thresholds are un-calibrated guesses, not a measured
# baseline, so they warn rather than fail the build until real scores are
# available to set genuine gates.

on:
  push:
    branches: [main]
    paths:
      - index.html
      - privacy.html
      - design-system.html
      - styles.css
      - lighthouserc.js
  workflow_dispatch: {}

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI
        run: lhci autorun
