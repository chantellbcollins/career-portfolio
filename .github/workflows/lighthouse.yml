name: Lighthouse

# Runs Lighthouse CI (performance, accessibility, best-practices, SEO)
# against index.html, privacy.html, and design-system.html on every push
# that could affect them, and fails the build if a score drops below its
# threshold in lighthouserc.js. Thresholds are calibrated from a real run,
# not guessed - see lighthouserc.js for the measured baseline and the
# reasoning (including why design-system.html's SEO gate is off).

on:
  push:
    branches: [main]
    paths:
      - index.html
      - privacy.html
      - design-system.html
      - styles.css
      - lighthouserc.js
  workflow_dispatch: {}

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI
        run: lhci autorun
