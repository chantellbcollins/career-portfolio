name: Design system sync

# Keeps design-system.html's type scale (H1/H2 size + line-height), the
# eyebrow tier's line-height, two mirrored copy snippets (the Trajectory
# intro used as the Type section's Body specimen, and the hero eyebrow
# badges), and the Capabilities demo's tab labels in sync with index.html
# and styles.css automatically. Also cache-busts the styles.css link on
# index.html/privacy.html with a content hash, so a CSS change doesn't get
# silently ignored by returning visitors' cached copies. Deliberately
# narrow scope beyond that: spacing-scale usage and the prose captions
# describing component behavior still need a human/AI judgment call and
# are not touched here.
#
# Runs only when index.html, privacy.html, or styles.css change on main,
# so a sync commit (which only ever touches design-system.html plus the
# styles.css?v= hash on index.html/privacy.html) can never re-trigger
# itself.

on:
  push:
    branches: [main]
    paths:
      - index.html
      - privacy.html
      - styles.css
  pull_request:
    branches: [main]
    paths:
      - index.html
      - privacy.html
      - styles.css
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - name: Run sync script
        run: bash scripts/sync-design-system.sh

      - name: Fail on drift (PR) or commit the fix (push to main)
        # On a pull_request, auto-committing would push to someone's PR
        # branch mid-review, so this fails the check instead and prints the
        # diff, requiring the sync to be run and committed before merge. On
        # a direct push to main, keep the existing auto-fix-commit behavior.
        run: |
          if git diff --quiet -- design-system.html index.html privacy.html; then
            echo "Nothing out of sync, nothing to do."
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::error::design-system.html and/or the styles.css cache-bust hash on index.html/privacy.html are out of sync. Run scripts/sync-design-system.sh locally and commit the result."
            git diff -- design-system.html index.html privacy.html
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design-system.html index.html privacy.html
          {
            echo "Auto-sync design-system.html and styles.css cache-bust hash from ${GITHUB_SHA}"
            echo ""
            echo "Type scale, eyebrow line-height, mirrored specimen copy, and capability"
            echo "tab labels updated to match index.html/styles.css; the styles.css?v="
            echo "hash on index.html/privacy.html updated to match styles.css's current"
            echo "content. See scripts/sync-design-system.sh for exactly what this does"
            echo "and doesn't cover."
          } > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt
          git push
