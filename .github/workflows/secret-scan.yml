name: Secret and personal data scan

# Scans the files changed in a pull request for phone numbers, emails,
# street addresses and key-like strings. Intended public contact details
# are listed in scripts/secret-scan-allowlist.json. The log shows file,
# line and rule only, never the matched text. Git history is not scanned.
# Manual runs (workflow_dispatch) scan every tracked file.

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scan changed files
        if: github.event_name == 'pull_request'
        run: node scripts/secret-scan.js --base "origin/${{ github.base_ref }}"

      - name: Scan all tracked files
        if: github.event_name != 'pull_request'
        run: node scripts/secret-scan.js --all
