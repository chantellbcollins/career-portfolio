name: Lighthouse

# Runs Lighthouse CI (performance, accessibility, best-practices, SEO)
# against index.html, privacy.html, and design-system.html on every push
# that could affect them, and fails the build if a score drops below its
# threshold in lighthouserc.js. Thresholds are calibrated from a real run,
# not guessed - see lighthouserc.js for the measured baseline and the
# reasoning (including why design-system.html's SEO gate is off).

on:
  push:
    branches: [main]
    paths:
      - index.html
      - privacy.html
      - design-system.html
      - styles.css
      - lighthouserc.js
      - scripts/lighthouse-summary.js
  pull_request:
    branches: [main]
    paths:
      - index.html
      - privacy.html
      - design-system.html
      - styles.css
      - lighthouserc.js
      - scripts/lighthouse-summary.js
  workflow_dispatch: {}

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI
        run: lhci autorun

      - name: Write score summary
        # Runs even if the assert step above failed, so a threshold breach
        # still leaves the real numbers visible. GitHub's Job Summary is a
        # static markdown panel (unlike the live log, which doesn't reliably
        # render outside an authenticated browser session), so this is the
        # dependable way to read actual Lighthouse scores for this repo.
        if: always()
        run: node scripts/lighthouse-summary.js
